<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-9">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Petard Crash</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --primary: #00f2ff;
            --bg: #0a0b10;
            --card: #161821;
            --danger: #ff0055;
            --success: #00ff88;
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg);
            color: white;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-container {
            background: var(--card);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.1);
            width: 80%;
            max-width: 350px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        #multiplier {
            font-size: 64px;
            font-weight: 800;
            margin: 20px 0;
            color: var(--primary);
            text-shadow: 0 0 20px rgba(0, 242, 255, 0.5);
            transition: transform 0.1s;
        }

        .boom {
            color: var(--danger) !important;
            text-shadow: 0 0 20px rgba(255, 0, 85, 0.5) !important;
            animation: shake 0.5s;
        }

        .btn {
            width: 100%;
            padding: 18px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        #start-btn {
            background: linear-gradient(45deg, var(--primary), #0077ff);
            color: white;
            box-shadow: 0 10px 20px rgba(0, 119, 255, 0.3);
        }

        #start-btn:active { transform: scale(0.95); }

        #cashout-btn {
            background: linear-gradient(45deg, var(--success), #00ba63);
            color: #05331f;
            display: none;
            box-shadow: 0 10px 20px rgba(0, 255, 136, 0.2);
        }

        .status-text {
            font-size: 14px;
            color: #6a6d7a;
            margin-bottom: 10px;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            50% { transform: translate(-1px, 2px) rotate(1deg); }
            100% { transform: translate(1px, -2px) rotate(0deg); }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="status-text">СТАВКА: 10 МОНЕТ</div>
        <div id="multiplier">1.00x</div>
        
        <button id="start-btn" class="btn" onclick="startGame()">ВЗЛЕТАЕМ!</button>
        <button id="cashout-btn" class="btn" onclick="cashOut()">ЗАБРАТЬ</button>
    </div>

    <script>
    let tg = window.Telegram.WebApp;
    tg.expand(); // Развернуть на весь экран

    let currentMultiplier = 1.00;
    let gameInterval;
    let isRunning = false;

    const multDisplay = document.getElementById('multiplier');
    const startBtn = document.getElementById('start-btn');
    const cashBtn = document.getElementById('cashout-btn');

    function startGame() {
        if (isRunning) return;
        
        isRunning = true;
        currentMultiplier = 1.00;
        
        // Визуально меняем кнопки
        multDisplay.classList.remove('boom');
        startBtn.style.display = 'none';
        cashBtn.style.display = 'block';

        // Запускаем цикл роста
        gameInterval = setInterval(() => {
            currentMultiplier += 0.01; // Скорость роста
            multDisplay.innerText = currentMultiplier.toFixed(2) + 'x';
            
            // Маленький эффект пульсации
            multDisplay.style.transform = scale(${1 + (currentMultiplier * 0.02)});
        }, 100); 
    }

    function cashOut() {
        if (!isRunning) return;
        
        clearInterval(gameInterval);
        isRunning = false;
        
        let stopAt = currentMultiplier.toFixed(2);
        
        // Отправляем данные боту (в Python)
        tg.sendData(JSON.stringify({
            "action": "cashout_request",
            "stopped_at": stopAt
        }));

        // Сообщаем игроку и закрываем через секунду
        multDisplay.style.color = "#00ff88"; 
        alert("Забрал на: " + stopAt + "x");
        setTimeout(() => tg.close(), 500);
    }
</script>

</body>
</html>
