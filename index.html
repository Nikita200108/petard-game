    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();
        tg.MainButton.setParams({ text: "ЗАКРЫТЬ ИГРУ", color: "#161821" });

        let currentMultiplier = 1.00;
        let gameInterval;
        let isRunning = false;

        function startGame() {
            isRunning = true;
            currentMultiplier = 1.00;
            
            document.getElementById('multiplier').classList.remove('boom');
            document.getElementById('start-btn').style.display = 'none';
            document.getElementById('cashout-btn').style.display = 'block';

            gameInterval = setInterval(() => {
                // Плавное ускорение роста
                let increment = 0.01 + (currentMultiplier * 0.002); 
                currentMultiplier += increment;

let displayVal = currentMultiplier.toFixed(2);
                document.getElementById('multiplier').innerText = displayVal + 'x';

                // Для красоты: слегка пульсируем текст
                document.getElementById('multiplier').style.transform = scale(${1 + (currentMultiplier * 0.01)});
            }, 100);
        }

        function cashOut() {
            if (!isRunning) return;
            clearInterval(gameInterval);
            isRunning = false;
            
            let stopAt = currentMultiplier.toFixed(2);
            
            // Отправляем данные на сервер для проверки
            tg.sendData(JSON.stringify({
                "action": "cashout_request",
                "stopped_at": stopAt
            }));
            
            setTimeout(() => tg.close(), 1000);
        }

        // Эмуляция краша для красоты (визуальная, сервер всё равно проверит)

    </script>
